server.port=8761
spring.application.name=eureka-server

# Standalone registry: it does not register with, or fetch from, another
# Eureka server.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:${server.port}/eureka/

# Self-preservation keeps instances that stopped sending heartbeats, which
# suits large clusters with flaky networks. In this small setup pods are
# replaced often, so stale instances are evicted promptly instead.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
