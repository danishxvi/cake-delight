server.port=8084
spring.application.name=notification-service

# Database owned by this service. Host names match the Kubernetes and Docker
# Compose service names; override with SPRING_DATASOURCE_* environment
# variables when running elsewhere.
spring.datasource.url=jdbc:mysql://mysql-service:3306/cakedelight_notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Credentials are supplied by the deployment (Kubernetes Secret or Docker
# Compose environment).
spring.rabbitmq.host=rabbitmq-service
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# A failing message is attempted 3 times in total (1s, then 2s apart) and is
# then rejected without requeueing, which moves it to the dead-letter queue.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Keep the listener running if the queue does not exist yet (for example just
# after a RabbitMQ restart); it is declared again on reconnect.
spring.rabbitmq.listener.simple.missing-queues-fatal=false

eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
