server.port=8082
spring.application.name=order-service

# Database owned by this service. Host names match the Kubernetes and Docker
# Compose service names; override with SPRING_DATASOURCE_* environment
# variables when running elsewhere.
spring.datasource.url=jdbc:mysql://mysql-service:3306/cakedelight_order?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Credentials are supplied by the deployment (Kubernetes Secret or Docker
# Compose environment).
spring.rabbitmq.host=rabbitmq-service
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Resolved through Eureka by the load-balanced REST client. The load balancer
# for it is created at startup, so the first request does not pay for it.
catalog.service-url=http://cake-catalog-service
spring.cloud.loadbalancer.eager-load.clients=cake-catalog-service

eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
