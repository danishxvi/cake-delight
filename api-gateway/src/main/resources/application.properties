server.port=8080
spring.application.name=api-gateway

# ---------------------------------------------------------------------------
# Service discovery
# ---------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.instance.prefer-ip-address=true
# Refresh the registry and load balancer cache every 5 seconds (defaults are
# 30s and 35s), so a restarted service is reachable again quickly.
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
# Create the load balancers at startup instead of on each route's first request.
spring.cloud.loadbalancer.eager-load.clients=cake-catalog-service,order-service,rating-service,notification-service

# ---------------------------------------------------------------------------
# Routes
# "lb://service-name" resolves the target through Eureka and load balances
# across all registered instances of that service.
# ---------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=cake-catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://cake-catalog-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[2].id=rating-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://rating-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ratings/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# OpenAPI documents of each service, exposed under /<service-name>/v3/api-docs
# for the shared Swagger UI. RewritePath strips the prefix before forwarding.
spring.cloud.gateway.server.webflux.routes[4].id=cake-catalog-service-api-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://cake-catalog-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/cake-catalog-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/cake-catalog-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=order-service-api-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/order-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/order-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[6].id=rating-service-api-docs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://rating-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/rating-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/rating-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[7].id=notification-service-api-docs
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/notification-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/notification-service/v3/api-docs,/v3/api-docs

# ---------------------------------------------------------------------------
# Connections to the backend services
# Timeouts stop a slow or unreachable service from holding requests open. The
# response timeout leaves room for the first requests after a cold start and
# for the retries a service makes when it calls another service.
# Pooled connections are dropped after 30 seconds idle (below Tomcat's 60
# second keep-alive) and renewed every 5 minutes, so the gateway never sends a
# request over a connection the other side has already closed.
# ---------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=5m
spring.cloud.gateway.server.webflux.httpclient.pool.eviction-interval=10s

# ---------------------------------------------------------------------------
# CORS
# The frontend is served from a different origin (port 30000), so the browser
# needs CORS headers. "*" keeps local setup simple; a real deployment would
# list the frontend's own domain instead.
# ---------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

# ---------------------------------------------------------------------------
# Swagger UI for all services, at /swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.urls[0].name=Cake Catalog Service
springdoc.swagger-ui.urls[0].url=/cake-catalog-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Rating Service
springdoc.swagger-ui.urls[2].url=/rating-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=/notification-service/v3/api-docs

# ---------------------------------------------------------------------------
# Monitoring
# Only non-sensitive endpoints are exposed, because the gateway is public.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
