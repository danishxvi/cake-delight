server.port=8081
spring.application.name=cake-catalog-service

# Database owned by this service. Host names match the Kubernetes and Docker
# Compose service names; override with SPRING_DATASOURCE_* environment
# variables when running elsewhere.
spring.datasource.url=jdbc:mysql://mysql-service:3306/cakedelight_catalog?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate keeps the schema in sync with the entities. A production system
# would manage schema changes with a migration tool such as Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Separate liveness and readiness groups for the Kubernetes probes.
management.endpoint.health.probes.enabled=true
