# Internal ClusterIP Service. To open the Eureka dashboard from your machine:
# kubectl port-forward svc/eureka-service 8761:8761
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  labels:
    app: eureka-server
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
