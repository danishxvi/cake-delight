# Credentials for MySQL and RabbitMQ.
#
# These are local development values, kept here so the project deploys with a
# single command. Kubernetes Secrets are only base64 encoded, not encrypted.
# For a real environment, create the Secrets outside version control (or use
# a secret manager) and never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  RABBITMQ_USER: "cakeuser"
  RABBITMQ_PASS: "cakepass123"
