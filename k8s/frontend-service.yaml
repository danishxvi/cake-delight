# Exposes the website outside the cluster on node port 30000. The Service
# port is also 30000, so switching the type to LoadBalancer publishes the site
# on localhost:30000 as well. See the README for reaching it on Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 30000
      targetPort: 80
      nodePort: 30000
