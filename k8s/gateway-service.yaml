# Exposes the gateway outside the cluster on node port 30080, which is where
# the browser sends its API calls. The Service port is also 30080, so switching
# the type to LoadBalancer publishes it on localhost:30080 as well. See the
# README for reaching it on Docker Desktop.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 30080
      targetPort: 8080
      nodePort: 30080
